name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch has current GTK 4 and gtk4-layer-shell packages.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 gtk4-layer-shell pkgconf
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: wname-x86_64-linux
          path: target/release/wname
