[package]
name = "wname"
version = "0.2.0"
edition = "2024"
description = "Put a large, colored name band on a Hyprland window"
license = "MIT"
readme = "README.md"
repository = "https://github.com/pahlisch/wname"
keywords = ["hyprland", "wayland", "window", "label", "layer-shell"]
categories = ["command-line-utilities", "gui"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
glib-unix = "0.22"
gtk4 = { version = "0.11.5", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
