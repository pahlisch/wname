# Config for the throwaway Hyprland that the integration tests drive.
# The tests refuse to run against any instance not started with this file.

monitor = , preferred, auto, 1

general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  layout = dwindle
}

input {
  follow_mouse = 1
}

animations {
  enabled = false
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  focus_on_activate = true
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}
